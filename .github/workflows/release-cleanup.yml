name: Release Cleanup (Sync develop with main)

on:
  workflow_call:
    inputs:
      consolidate_history:
        description: "Reset develop to main after release (force-push)."
        required: false
        type: boolean
        default: false
      squash_boundary_sha:
        description: "The develop SHA that was squashed into main. Required when consolidate_history is true."
        required: false
        type: string
        default: ""
    secrets:
      bot_app_id:
        required: true
      bot_private_key:
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    name: Sync develop with main
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.bot_app_id }}
          private-key: ${{ secrets.bot_private_key }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: develop

      - name: Get bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.bot-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Consolidate develop onto main
        id: consolidate
        if: ${{ inputs.consolidate_history }}
        env:
          BOUNDARY: ${{ inputs.squash_boundary_sha }}
        run: |
          set -euo pipefail

          git fetch origin main develop

          if [ -z "$BOUNDARY" ]; then
            echo "::warning::consolidate_history is set but squash_boundary_sha is empty; merging instead"
            exit 0
          fi

          DEVELOP_SHA=$(git rev-parse origin/develop)
          if [ "$DEVELOP_SHA" != "$BOUNDARY" ]; then
            echo "::warning::develop advanced during the release (${DEVELOP_SHA:0:7} != ${BOUNDARY:0:7}); merging instead"
            exit 0
          fi

          MAIN_SHA=$(git rev-parse origin/main)

          # The lease makes this atomic. If develop advances between the check above
          # and the push, the push is rejected rather than discarding those commits.
          if git push --force-with-lease=refs/heads/develop:"$BOUNDARY" \
              origin "${MAIN_SHA}:refs/heads/develop"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Reset develop to main (${MAIN_SHA:0:7})"
            {
              echo "### History consolidated"
              echo ""
              echo "\`develop\` was reset to \`main\` (\`${MAIN_SHA:0:7}\`)."
              echo ""
              echo "Local clones need \`git reset --hard origin/develop\`. A \`git pull\`"
              echo "re-merges the replaced history and reverts the consolidation."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Force-push was rejected; merging instead"
          fi

      - name: Merge main into develop
        if: ${{ steps.consolidate.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          git fetch origin main develop
          git checkout -B develop origin/develop

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already merged into develop (no-op)"
            exit 0
          fi

          if git merge --no-ff -m "Merge main into develop" origin/main; then
            git push origin develop
            echo "Merged main into develop ($(git rev-parse --short HEAD))"
            exit 0
          fi

          # Conflict path: open a PR so the conflicts can be resolved in GitHub's web UI.
          git merge --abort || true

          MAIN_SHA=$(git rev-parse origin/main)
          SHORT_SHA="${MAIN_SHA:0:7}"
          BRANCH="cleanup/merge-main-${SHORT_SHA}"

          # Snapshot main's tip onto a stable cleanup branch as the PR head.
          git push --force-with-lease origin "${MAIN_SHA}:refs/heads/${BRANCH}"

          EXISTING=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --base develop \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::warning::Cleanup conflict; PR #${EXISTING} already open for ${BRANCH}"
            exit 0
          fi

          gh pr create \
            --repo "${REPO}" \
            --base develop \
            --head "${BRANCH}" \
            --assignee "${ACTOR}" \
            --title "Resolve merge conflict: main into develop (${SHORT_SHA})" \
            --body "$(cat <<EOF
          The release-cleanup workflow could not auto-merge \`main\` into \`develop\` after the latest release.

          - Conflicting head on main: \`${MAIN_SHA}\`
          - Use GitHub's **Resolve conflicts** button on this PR to fix in-browser, then merge with **Create a merge commit** (not squash).
          - Or locally:
            \`\`\`
            git fetch origin main develop
            git checkout develop && git pull
            git merge main   # resolve conflicts
            git push origin develop
            \`\`\`
          EOF
          )"

          echo "::warning::Cleanup conflict; opened PR for manual resolution"
